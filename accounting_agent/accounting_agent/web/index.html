<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能记账助手</title>
<style>
  :root {
    --primary:#5B8FF9; --primary2:#9270CA; --inc:#2f9e44; --exp:#e8684a;
    --bg:#f6f7fb; --card:#fff; --text:#222; --muted:#888;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    margin:0; background:var(--bg); color:var(--text);
  }
  header {
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff; padding:22px 18px 26px;
  }
  header h1 { margin:0; font-size:20px; }
  header p { margin:6px 0 0; opacity:.85; font-size:12.5px; }
  main { padding:16px; max-width:640px; margin:0 auto; }
  .upload {
    background:var(--card); border-radius:16px; padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:16px;
  }
  .upload label {
    display:flex; align-items:center; justify-content:center; gap:10px;
    border:2px dashed #c9d4f7; border-radius:14px; padding:26px 12px;
    color:#4a6cd4; font-weight:600; font-size:15px; cursor:pointer;
    background:#fbfcff;
  }
  .upload label:active { background:#eef2ff; }
  .upload input { display:none; }
  .hint { color:var(--muted); font-size:12px; margin:12px 4px 0; line-height:1.6; }
  .loading { display:none; text-align:center; padding:24px 0; }
  .spinner {
    width:34px; height:34px; margin:0 auto 12px;
    border:4px solid #dfe6f8; border-top-color:var(--primary); border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .stage { font-size:14px; color:#4a5a7a; font-weight:600; margin:6px 0 2px; }
  .stage-time { font-size:12px; color:var(--muted); margin-bottom:14px; }
  .bar { height:10px; border-radius:6px; background:#e9eef9; overflow:hidden; margin:8px 0 2px; }
  .bar-fill { height:100%; width:0%; border-radius:6px; background:linear-gradient(90deg,var(--primary),var(--primary2)); transition:width .5s ease; }
  .bar-label { font-size:11px; color:var(--muted); text-align:right; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0; }
  .card { background:var(--card); border-radius:14px; padding:14px 10px; box-shadow:0 2px 6px rgba(0,0,0,.05); }
  .card .lb { font-size:12px; color:var(--muted); }
  .card .val { font-size:20px; font-weight:800; margin-top:4px; }
  .card .sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .btn-report {
    display:block; width:100%; text-align:center; padding:14px; margin:14px 0;
    background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#fff;
    border:none; border-radius:14px; font-size:15px; font-weight:700; text-decoration:none;
  }
  h2 { font-size:15px; margin:18px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; font-size:13px; box-shadow:0 2px 6px rgba(0,0,0,.05); }
  th { background:#f0f2fa; text-align:left; padding:9px 10px; font-weight:600; }
  td { padding:8px 10px; border-top:1px solid #f0f0f0; }
  .inc { color:var(--inc); font-weight:700; }
  .exp { color:var(--exp); font-weight:700; }
  .table-wrap { max-height:420px; overflow-y:auto; border-radius:12px; }
  .err { background:#fdecec; color:#c0392b; border-radius:12px; padding:14px; font-size:13px; margin-top:12px; }
  .result { display:none; }
  footer { text-align:center; color:#bbb; font-size:11px; padding:20px 0 30px; }
</style>
</head>
<body>
<header>
  <h1>📒 智能记账助手</h1>
  <p>支付记录长截图 / 录屏 → 账本 + 统计图表</p>
</header>
<main>
  <div class="upload">
    <label for="file">
      <span>📷</span>
      <span>点击选择截图或录屏</span>
    </label>
    <input id="file" type="file" accept="image/*,video/*">
    <div class="hint">支持长截图（png/jpg）或录屏视频（mp4 等）。大文件请耐心等待进度条。</div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="stage" id="stage">准备上传…</div>
    <div class="stage-time" id="stageTime"></div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="bar-label" id="barLabel">0%</div>
  </div>

  <div class="result" id="result">
    <div class="cards">
      <div class="card"><div class="lb">支出</div><div class="val exp" id="vExp">-</div><div class="sub" id="sExp">0 笔</div></div>
      <div class="card"><div class="lb">收入</div><div class="val inc" id="vInc">-</div><div class="sub" id="sInc">0 笔</div></div>
      <div class="card"><div class="lb">笔数</div><div class="val" id="vCount">-</div><div class="sub" id="sInserted"></div></div>
    </div>
    <a class="btn-report" id="reportLink" href="#" target="_blank">📊 打开统计图表报告</a>
    <h2>交易明细</h2>
    <div class="table-wrap"><table id="txTable"></table></div>
    <div class="err" id="error" style="display:none"></div>
  </div>
</main>
<footer>accounting_agent · LangGraph · DeepSeek</footer>

<script>
const $ = id => document.getElementById(id);
const fileInput = $('file'), loading = $('loading'), result = $('result');
let pollTimer = null, startTime = 0;

function fmt(n) { return '¥' + n.toLocaleString('zh-CN', {minimumFractionDigits:2}); }
function setBar(pct, label) { $('barFill').style.width = pct + '%'; $('barLabel').textContent = label || pct + '%'; }
function setStage(s, t) {
  $('stage').textContent = s;
  const sec = Math.floor((Date.now() - startTime) / 1000);
  $('stageTime').textContent = (t || '') + (sec ? ' · 已用时 ' + sec + ' 秒' : '');
}

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  $('error').style.display = 'none';
  result.style.display = 'none';
  loading.style.display = 'block';
  startTime = Date.now();
  setBar(0, '0%');
  setStage('上传中…', '');
  clearInterval(pollTimer);

  // 用 XHR 获得真实上传进度
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/process');
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) {
      const p = Math.round(e.loaded / e.total * 100);
      setBar(p, p + '%');
      setStage('上传中… ' + fmtSize(e.loaded), '');
    }
  };
  xhr.onload = () => {
    if (xhr.status !== 200) { showError('上传失败: HTTP ' + xhr.status); return; }
    const j = JSON.parse(xhr.responseText);
    startPoll(j.job_id);
  };
  xhr.onerror = () => showError('网络错误，上传失败，请重试');
  xhr.onabort = () => showError('上传已取消');
  const fd = new FormData();
  fd.append('file', f);
  xhr.send(fd);
});

function fmtSize(b) {
  if (b > 1024*1024) return (b/1024/1024).toFixed(1) + 'MB';
  return (b/1024).toFixed(0) + 'KB';
}

function startPoll(id) {
  setBar(8, '');
  setStage('排队处理…', '');
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch('/api/status/' + id);
      const j = await r.json();
      if (j.state === 'processing' || j.state === 'pending') {
        setBar(j.progress || 8, j.progress + '%');
        setStage(j.stage || '处理中…');
      } else if (j.state === 'done') {
        clearInterval(pollTimer);
        loading.style.display = 'none';
        render(j.result);
      } else if (j.state === 'error') {
        clearInterval(pollTimer);
        loading.style.display = 'none';
        showError('处理失败：' + (j.error || '未知错误'));
      }
    } catch (e) {
      clearInterval(pollTimer);
      loading.style.display = 'none';
      showError('查询进度失败：' + e);
    }
  }, 1500);
}

function showError(msg) {
  loading.style.display = 'none';
  const e = $('error'); e.textContent = msg; e.style.display = 'block';
  result.style.display = 'block';
}

function render(j) {
  result.style.display = 'block';
  const exps = j.transactions.filter(t => t.type === 'expense');
  const incs = j.transactions.filter(t => t.type === 'income');
  $('vExp').textContent = fmt(j.expense);
  $('sExp').textContent = exps.length + ' 笔';
  $('vInc').textContent = fmt(j.income);
  $('sInc').textContent = incs.length + ' 笔';
  $('vCount').textContent = j.transaction_count;
  $('sInserted').textContent = '入库 ' + j.inserted + ' · 重复 ' + j.duplicates;
  const link = $('reportLink');
  if (j.report_url) { link.href = j.report_url; link.style.display = 'block'; }
  else link.style.display = 'none';
  const rows = j.transactions.slice().sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
  $('txTable').innerHTML =
    '<tr><th>日期</th><th>金额</th><th>类别</th><th>商户</th></tr>' +
    rows.map(t => `<tr>
      <td>${(t.date||'-').slice(5)}</td>
      <td class="${t.type}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</td>
      <td>${t.category}</td>
      <td>${t.merchant||'-'}</td></tr>`).join('');
}
</script>
</body>
</html>
