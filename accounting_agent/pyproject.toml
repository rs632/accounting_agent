[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accounting-agent"
version = "0.1.0"
description = "智能记账助手 - 基于 LangChain/LangGraph 的支付记录长截图 → 账本 + 统计图表"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ocr-paddle = ["paddlepaddle>=3.0.0", "paddleocr>=2.8.0"]
ocr-rapid = ["rapidocr_onnxruntime>=1.1.0", "opencv-python-headless>=4.9.0"]
dev = ["pytest>=7.0"]

[project.scripts]
accounting-agent = "accounting_agent.main:cli"

[tool.setuptools.packages.find]
include = ["accounting_agent*"]
